name: Build & Release

# Supply-chain notes:
# - Actions are pinned to commit SHAs (Dependabot keeps them current).
# - Python build deps are installed from a hash-locked file.
# - Build jobs only get read access to the repo; they cannot touch releases.
# - Every binary gets a signed build-provenance attestation (Sigstore), so
#   users can check it with `gh attestation verify <file> --repo AHTOOOXA/open-holdem-manager`.
# - The release is created as a DRAFT. Review it and publish it by hand.

on:
  push:
    tags:
      - "v*"
  # Manual run = build + attest only (dry run), no release is created
  workflow_dispatch:

permissions:
  contents: read # default for every job: read-only

# One run per tag; never cancel a release build halfway
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read # checkout only
      id-token: write # Sigstore signing for build provenance
      attestations: write # store the provenance attestation

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No dependency cache in release builds (cache poisoning). v4 only caches
      # when `cache:` is set; on v5+ add `package-manager-cache: false`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # ── Python backend ──────────────────────────────────────────
      - name: Install Python dependencies (hash-locked)
        run: pip install --require-hashes -r backend/requirements-build.lock

      - name: Build backend with PyInstaller
        working-directory: backend
        run: >
          pyinstaller
          --name ohm-backend
          --onedir
          --noconfirm
          --clean
          --collect-submodules uvicorn
          --collect-submodules fastapi
          --collect-submodules starlette
          --collect-submodules pydantic
          --collect-submodules duckdb
          --hidden-import multipart
          run_server.py

      # ── Frontend ────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          ELECTRON: "1"

      # ── Electron ────────────────────────────────────────────────
      - name: Install Electron dependencies
        run: npm ci

      - name: Build Electron app
        run: npx electron-builder "--$PLATFORM" --publish never
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  publish:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write # the only job that can write to releases

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.dmg *.zip *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create draft release
        run: >
          gh release create "$TAG"
          --repo "$REPO"
          --draft
          --title "$TAG"
          --generate-notes
          dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
