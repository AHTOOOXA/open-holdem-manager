appId: com.openholdemmanager.app
productName: Open Holdem Manager
copyright: Copyright © 2025-2026 Anton Safonov

publish:
  provider: github

directories:
  output: release
  buildResources: build

# Only package the electron/ folder (main process code)
files:
  - electron/**/*

# Bundle the built backend + frontend as resources
extraResources:
  - from: backend/dist/ohm-backend
    to: backend
    filter:
      - "**/*"
  - from: frontend/dist
    to: frontend
    filter:
      - "**/*"

mac:
  category: public.app-category.utilities
  # No spaces: CI uploads these files as-is, and latest*.yml must match the asset names
  artifactName: "Open-Holdem-Manager-${arch}.${ext}"
  target:
    - dmg
    - zip
  # To remove Gatekeeper warnings, configure code signing:
  # identity: "Developer ID Application: Your Name (TEAM_ID)"
  # notarize:
  #   teamId: TEAM_ID

dmg:
  title: "${productName}"

win:
  artifactName: "Open-Holdem-Manager-Setup.${ext}"
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
