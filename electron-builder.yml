appId: com.openholdemmanager.app
productName: Open Holdem Manager
copyright: Copyright © 2025

publish:
  provider: github

directories:
  output: release
  buildResources: build

# Only package the electron/ folder (main process code)
files:
  - electron/**/*

# Bundle the built backend + frontend as resources
extraResources:
  - from: backend/dist/ohm-backend
    to: backend
    filter:
      - "**/*"
  - from: frontend/dist
    to: frontend
    filter:
      - "**/*"

mac:
  category: public.app-category.utilities
  artifactName: "${productName}-${arch}.${ext}"
  target:
    - dmg
    - zip
  identity: null  # Ad-hoc sign (no Apple Developer account needed)

dmg:
  title: "${productName}"

win:
  artifactName: "${productName}-Setup.${ext}"
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
